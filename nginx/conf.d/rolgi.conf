upstream api {
  server api:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name rolgi.com www.rolgi.com;

  # HTTP to HTTPS redirect
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name rolgi.com www.rolgi.com;

  # SSL Configuration
  ssl_certificate /etc/letsencrypt/live/rolgi.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rolgi.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;

  # Security Headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;

  # Root directory for static files
  root /usr/share/nginx/html;
  index index.html;

  # Frontend (главная страница)
  location = / {
    try_files /index.html =404;
  }

  # Admin Panel
  location /admin {
    alias /usr/share/nginx/html/admin;
    try_files $uri $uri/ /admin/index.html;
    index index.html;
  }

  # API proxying
  location /api/ {
    proxy_pass http://api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90;
  }

  # Health endpoint
  location /health {
    proxy_pass http://api/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # API Docs
  location /docs {
    proxy_pass http://api/docs;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Metrics
  location /metrics {
    proxy_pass http://api/metrics;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Static assets with caching
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Deny access to hidden files
  location ~ /\. {
    deny all;
  }
}
