
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: rolgi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rolgi_v6
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/database/schema/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - rolgi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Rolgi API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: rolgi-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3000
      API_HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rolgi_v6
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SSTATS_API_URL: ${SSTATS_API_URL:-https://api.sstats.net}
      SSTATS_API_KEY: ${SSTATS_API_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENABLE_SWAGGER: ${ENABLE_SWAGGER:-true}
      ENABLE_CORS: ${ENABLE_CORS:-true}
      ENABLE_RATE_LIMIT: ${ENABLE_RATE_LIMIT:-true}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./memories:/app/memories
      - api-logs:/app/logs
      - ./src:/app/src
      - ./scripts:/app/scripts:ro
    networks:
      - rolgi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis Cache (optional, for future use)
  redis:
    image: redis:7-alpine
    container_name: rolgi-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - rolgi-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: rolgi-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - rolgi-network
    profiles:
      - with-nginx

volumes:
  postgres-data:
    name: rolgi-postgres-data
  redis-data:
    name: rolgi-redis-data
  api-logs:
    name: rolgi-api-logs

networks:
  rolgi-network:
    name: rolgi-network
    driver: bridge
