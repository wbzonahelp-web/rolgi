# Grafana Dashboard Provisioning
# Rolgi SStats Analytics Platform v6.1.0

apiVersion: 1

providers:
  - name: 'Rolgi Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
