# Alertmanager Configuration
# Rolgi SStats Analytics Platform v6.1.0

global:
  resolve_timeout: 5m
  # SMTP settings (optional)
  smtp_from: 'alertmanager@rolgi.local'
  smtp_smarthost: 'localhost:587'
  smtp_auth_username: ''
  smtp_auth_password: ''
  smtp_require_tls: false

# Routes define how alerts are grouped and where they're sent
route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  receiver: 'default'
  
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    
    # Warning alerts - less frequent
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 4h

# Receivers define notification channels
receivers:
  # Default receiver (logs only)
  - name: 'default'
    webhook_configs:
      - url: 'http://host.docker.internal:3000/api/webhooks/alertmanager'
        send_resolved: true

  # Critical alerts - multiple channels
  - name: 'critical-alerts'
    # Email
    email_configs:
      - to: 'admin@rolgi.local'
        subject: '[CRITICAL] {{ .GroupLabels.alertname }}'
        html: '{{ range .Alerts }}{{ .Annotations.summary }}: {{ .Annotations.description }}{{ end }}'
    
    # Slack
    slack_configs:
      - api_url: 'YOUR_SLACK_WEBHOOK_URL'
        channel: '#alerts-critical'
        title: '[CRITICAL] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
    
    # Webhook (to Rolgi alerting system)
    webhook_configs:
      - url: 'http://host.docker.internal:3000/api/webhooks/alertmanager'
        send_resolved: true

  # Warning alerts - less intrusive
  - name: 'warning-alerts'
    # Slack только
    slack_configs:
      - api_url: 'YOUR_SLACK_WEBHOOK_URL'
        channel: '#alerts'
        title: '[WARNING] {{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
        send_resolved: true
    
    # Webhook
    webhook_configs:
      - url: 'http://host.docker.internal:3000/api/webhooks/alertmanager'
        send_resolved: true

# Inhibit rules - suppress certain alerts when others are firing
inhibit_rules:
  # Inhibit warning if critical is firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
