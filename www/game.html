<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Матч — Rolgi SStats</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/app.css">
    <style>
        /* ─── Специфика страницы матча (не вынесено в app.css) ─── */
        .g-back {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-muted); font-size: 0.92em;
            padding: 6px 0; margin-bottom: 8px;
        }
        .g-back:hover { color: var(--primary-color); text-decoration: none; }

        .g-league-row {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.95em; color: var(--text-muted); margin-bottom: 12px;
        }
        .g-league-row .g-flag { font-size: 1.2em; }
        .g-league-row .g-league-name { color: var(--text-color); font-weight: 500; }
        .g-league-row .g-dot { opacity: 0.4; }

        .g-match-card {
            background: var(--card-bg);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-md);
            padding: 22px 20px 18px;
            margin-bottom: 18px;
        }
        .g-match-main {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 16px;
        }
        .g-team {
            display: flex; flex-direction: column; align-items: center;
            text-align: center; gap: 8px;
        }
        .g-team-logo {
            width: 64px; height: 64px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            background: #f0f2f5;
            font-size: 1.6em; color: var(--text-muted);
            overflow: hidden;
        }
        .g-team-logo img { width: 100%; height: 100%; object-fit: contain; }
        .g-team-name {
            font-size: 1.05em; font-weight: 600;
            color: var(--text-color);
            line-height: 1.2;
        }
        .g-score-block {
            display: flex; flex-direction: column; align-items: center;
            gap: 6px; min-width: 130px;
        }
        .g-score {
            font-size: 2.6em; font-weight: 800;
            color: var(--text-color);
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .g-score-live { color: var(--live-color); }
        .g-score-scheduled { font-size: 1.6em; color: var(--text-muted); }
        .g-score-ht {
            font-size: 0.85em; color: var(--text-muted);
        }
        .g-status-row {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; margin-top: 4px;
        }
        .g-meta-row {
            display: flex; flex-wrap: wrap; gap: 16px;
            margin-top: 14px; padding-top: 14px;
            border-top: 1px solid var(--border-color);
            font-size: 0.88em; color: var(--text-muted);
        }
        .g-meta-row > div { display: inline-flex; align-items: center; gap: 6px; }
        .g-meta-row i { color: var(--primary-color); opacity: 0.7; }

        /* Tabs */
        .g-tabs {
            display: flex; gap: 4px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 14px;
            overflow-x: auto;
        }
        .g-tab {
            padding: 10px 18px;
            background: transparent; border: none;
            color: var(--text-muted);
            font-size: 0.95em; font-weight: 500;
            cursor: pointer; white-space: nowrap;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: color 0.12s, border-color 0.12s;
        }
        .g-tab:hover { color: var(--text-color); }
        .g-tab.active {
            color: var(--primary-color);
            border-bottom-color: var(--primary-color);
        }
        .g-tab .g-tab-count {
            margin-left: 6px;
            display: inline-block;
            padding: 1px 8px; border-radius: 10px;
            background: #e9ecef; color: var(--text-color);
            font-size: 0.78em; font-weight: 600;
        }
        .g-tab.active .g-tab-count { background: var(--primary-color); color: white; }
        .g-tab-content { display: none; }
        .g-tab-content.active { display: block; }

        /* ── Analyzers tab ── */
        .anz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
        .anz-card { background: #1a1d24; border: 1px solid #2a2d36; border-radius: 8px; padding: 12px; }
        .anz-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 600; }
        .anz-card-header img { width: 20px; height: 20px; border-radius: 50%; }
        .anz-metric-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #23262e; font-size: 0.9rem; }
        .anz-metric-row:last-child { border-bottom: none; }
        .anz-metric-name { color: #9aa0aa; }
        .anz-metric-value { font-weight: 600; color: #e4e6ea; }
        .anz-metric-conf { font-size: 0.85rem; color: #6b7080; margin-left: 4px; }
        .anz-prediction-pill { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; }
        .anz-pill-W { background: #1d4d2a; color: #6ddc8a; }
        .anz-pill-D { background: #3a3a1a; color: #d7d472; }
        .anz-pill-L { background: #4d1d1d; color: #dc6d6d; }
        .anz-section-title { font-weight: 600; color: #c5c8d0; margin: 16px 0 8px 0; font-size: 0.9rem; }
        .anz-betting { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .anz-bet-card { background: #1a1d24; border: 1px solid #2a2d36; border-radius: 8px; padding: 10px; text-align: center; }
        .anz-bet-card.take { border-color: #2d6b3a; background: #16241a; }
        .anz-bet-card.strong-take { border-color: #3e9c4f; background: #1a3022; box-shadow: 0 0 0 1px #2d6b3a; }
        .anz-bet-card.cautious { border-color: #6b5a2d; background: #241f16; }
        .anz-bet-card.skip { opacity: 0.6; }
        .anz-bet-side { font-size: 0.85rem; color: #9aa0aa; text-transform: uppercase; }
        .anz-bet-odds { font-size: 18px; font-weight: 700; margin: 4px 0; }
        .anz-bet-edge { font-size: 0.9rem; font-weight: 600; }
        .anz-bet-edge.pos { color: #6ddc8a; }
        .anz-bet-edge.neg { color: #dc6d6d; }
        .anz-bet-kelly { font-size: 0.85rem; color: #9aa0aa; margin-top: 2px; }
        .anz-bet-rec { font-size: 0.85rem; font-weight: 700; margin-top: 4px; letter-spacing: 0.5px; }
        .anz-bet-rec.strong-take { color: #6ddc8a; }
        .anz-bet-rec.take { color: #98c97a; }
        .anz-bet-rec.cautious { color: #d7d472; }
        .anz-bet-rec.skip { color: #6b7080; }
        .anz-forecast { background: linear-gradient(135deg, #1a1d24, #1d2530); border: 1px solid #2a2d36; border-radius: 8px; padding: 14px; margin-top: 12px; text-align: center; }
        .anz-forecast-outcome { font-size: 1.375rem; font-weight: 700; margin: 4px 0; }
        .anz-forecast-conf-bar { height: 6px; background: #2a2d36; border-radius: 3px; overflow: hidden; margin: 8px auto; max-width: 220px; }
        .anz-forecast-conf-fill { height: 100%; background: linear-gradient(90deg, #4caf50, #8bc34a); }
        .anz-forecast-hint { font-size: 0.85rem; color: #6b7080; margin-top: 4px; }
        .anz-meta { font-size: 0.85rem; color: #6b7080; margin-top: 8px; text-align: right; }
        @media (max-width: 720px) { .anz-grid, .anz-betting { grid-template-columns: 1fr; } }

        /* Tooltip "?" icons */
        .anz-help {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: #2a2d36;
            color: #9aa0aa;
            font-size: 0.85rem;
            font-weight: 700;
            margin-left: 4px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
            border: none;
        }
        .anz-help:hover { background: #3a3d46; color: #d4d6da; }
        .anz-popover {
            position: fixed;
            z-index: 9999;
            background: #1f2229;
            border: 1px solid #3a3d46;
            border-radius: 8px;
            padding: 12px 14px;
            max-width: 320px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            font-size: 0.85rem;
            line-height: 1.5;
            color: #c8cad0;
            display: none;
        }
        .anz-popover.open { display: block; }
        .anz-popover-title { font-weight: 700; color: #e4e6ea; margin-bottom: 6px; font-size: 0.9rem; }
        .anz-popover-row { margin: 4px 0; }
        .anz-popover-row b { color: #d4d6da; }
        .anz-popover-close {
            position: absolute;
            top: 4px; right: 8px;
            cursor: pointer;
            color: #6b7080;
            font-size: 0.9rem;
        }
        .anz-popover-close:hover { color: #c8cad0; }

        /* Events timeline */
        .g-event {
            display: grid;
            grid-template-columns: 1fr 60px 1fr;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border-color);
            gap: 12px;
        }
        .g-event:last-child { border-bottom: none; }
        .g-event-side {
            display: flex; align-items: center; gap: 8px;
            min-width: 0;
        }
        .g-event-side-home { justify-content: flex-end; text-align: right; }
        .g-event-side-away { justify-content: flex-start; text-align: left; }
        .g-event-empty { visibility: hidden; }
        .g-event-icon {
            width: 24px; height: 24px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 50%; font-size: 0.85em; flex-shrink: 0;
        }
        .g-event-icon-goal     { background: rgba(39,174,96,0.15); color: var(--goal-color); }
        .g-event-icon-yellow   { background: rgba(241,196,15,0.2); color: #b8860b; }
        .g-event-icon-red      { background: rgba(231,76,60,0.18); color: var(--card-red); }
        .g-event-icon-sub      { background: rgba(52,152,219,0.15); color: var(--odds-home); }
        .g-event-icon-default  { background: #f0f2f5; color: var(--text-muted); }
        .g-event-text { min-width: 0; }
        .g-event-player {
            font-weight: 600; font-size: 0.93em;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .g-event-detail {
            font-size: 0.8em; color: var(--text-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .g-event-minute {
            text-align: center; font-weight: 700;
            color: var(--text-color); font-variant-numeric: tabular-nums;
            background: #f0f2f5; border-radius: 12px;
            padding: 3px 8px; font-size: 0.85em;
        }

        /* Lineups */
        .g-lineups-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .g-lineup-team h3 {
            font-size: 1em; font-weight: 600;
            margin-bottom: 10px; padding-bottom: 6px;
            border-bottom: 2px solid var(--primary-color);
            display: flex; align-items: center; justify-content: space-between;
        }
        .g-lineup-section-title {
            font-size: 0.78em; text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin: 14px 0 6px;
            font-weight: 600;
        }
        .g-player {
            display: flex; align-items: center; gap: 10px;
            padding: 6px 8px; border-radius: 6px;
            font-size: 0.92em;
        }
        .g-player:hover { background: #f8f9fa; }
        .g-player-num {
            width: 28px; text-align: center;
            font-weight: 700; color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }
        .g-player-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .g-player-pos {
            font-size: 0.75em; color: var(--text-muted);
            padding: 1px 6px; border-radius: 4px;
            background: #f0f2f5;
            font-weight: 600;
        }
        .g-player-cap {
            color: var(--warning-color); font-size: 0.85em;
        }
        .g-player-marks {
            display: flex; align-items: center; gap: 4px;
            font-size: 0.78em; color: var(--text-muted);
        }

        /* Stats bars */
        .g-stat-row {
            display: grid;
            grid-template-columns: 70px 1fr 70px;
            align-items: center;
            gap: 12px;
            padding: 10px 4px;
            border-bottom: 1px solid var(--border-color);
        }
        .g-stat-row:last-child { border-bottom: none; }
        .g-stat-val {
            font-weight: 700; font-variant-numeric: tabular-nums;
            font-size: 0.95em;
        }
        .g-stat-val-home { text-align: right; }
        .g-stat-val-away { text-align: left; }
        .g-stat-mid {
            text-align: center;
        }
        .g-stat-label {
            font-size: 0.82em; color: var(--text-muted);
            margin-bottom: 4px;
        }
        .g-stat-bar {
            position: relative; height: 6px;
            background: #f0f2f5; border-radius: 3px;
            overflow: hidden;
            display: flex;
        }
        .g-stat-bar-home { background: var(--primary-color); }
        .g-stat-bar-away { background: var(--secondary-color); }
        .g-stat-bar > span { display: block; height: 100%; transition: width 0.3s; }

        .g-empty {
            text-align: center; padding: 40px 20px;
            color: var(--text-muted);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .g-match-main {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            .g-team-logo { width: 48px; height: 48px; }
            .g-team-name { font-size: 0.95em; }
            .g-score { font-size: 2em; }
            .g-meta-row { gap: 10px; font-size: 0.82em; }
            .g-event {
                grid-template-columns: 1fr 50px 1fr;
                padding: 8px 6px; gap: 6px;
            }
            .g-event-player { font-size: 0.86em; }
            .g-event-detail { font-size: 0.74em; }
            .g-lineups-grid {
                grid-template-columns: 1fr;
                gap: 14px;
            }
            .g-stat-row {
                grid-template-columns: 50px 1fr 50px;
                gap: 8px;
            }
            .g-tab { padding: 10px 12px; font-size: 0.88em; }
        }
    </style>

    <style>
        .profit-wrap { padding: 8px 4px; }
        .profit-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-weight:600; gap:12px; flex-wrap:wrap; }
        .profit-table { width:100%; border-collapse:collapse; font-size:13px; }
        .profit-table th, .profit-table td { padding:8px 6px; text-align:center; border-bottom:1px solid rgba(255,255,255,0.06); }
        .profit-table thead th { background: rgba(255,255,255,0.03); color:#aaa; font-weight:600; }
        .profit-table .profit-market { text-align:left; }
        .roi-pos { color:#22c55e; font-weight:600; }
        .roi-neg { color:#ef4444; font-weight:600; }
        .roi-neu { color:#888; }
        .profit-legend { margin-top:12px; font-size:12px; color:#888; }
    </style>

    <style>
        .filters-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 12px;
            margin-bottom: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
            flex-wrap: wrap;
            font-size: 13px;
        }
        .filters-bar label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #ccc;
            cursor: pointer;
        }
        .filter-select {
            background: rgba(255,255,255,0.06);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 13px;
            cursor: pointer;
        }
        .filter-select:focus { outline: none; border-color: rgba(100,150,255,0.5); }
        .filter-check input { cursor: pointer; }
    </style>

    <style>
        .form-block { margin-bottom: 18px; }
        .form-title { display:flex; gap:12px; align-items:center; padding:8px 4px; font-weight:600; flex-wrap:wrap; }
        .form-chain { display:inline-flex; gap:3px; }
        .oc { display:inline-block; min-width:18px; text-align:center; padding:1px 4px; border-radius:3px; font-size:11px; font-weight:700; color:#fff; }
        .oc-w { background:#22c55e; }
        .oc-l { background:#ef4444; }
        .oc-d { background:#9ca3af; }
        .oc-x { background:#444; }
        .form-table-wrap { overflow-x:auto; }
        .form-table { width:100%; border-collapse:collapse; font-size:12px; }
        .form-table th, .form-table td { padding:6px 8px; border-bottom:1px solid rgba(255,255,255,0.05); text-align:left; vertical-align:middle; }
        .form-table thead th { background: rgba(255,255,255,0.03); color:#aaa; font-weight:600; font-size:11px; }
        .form-table tr.row-win { background: rgba(34,197,94,0.06); }
        .form-table tr.row-loss { background: rgba(239,68,68,0.06); }
        .form-table tr.row-draw { background: rgba(156,163,175,0.05); }
        .form-date { white-space:nowrap; color:#999; font-size:11px; }
        .form-teams { font-size:12px; }
        .form-teams .team-self { font-weight:700; color:#fff; }
        .form-goals { white-space:nowrap; }
        .goal-min { display:inline-block; padding:1px 5px; border-radius:3px; font-size:11px; margin-right:2px; }
        .goal-min.goal-home { background:rgba(34,197,94,0.18); color:#86efac; }
        .goal-min.goal-away { background:rgba(239,68,68,0.18); color:#fca5a5; }
        .form-odd { white-space:nowrap; font-variant-numeric:tabular-nums; }
        .odd-tag { display:inline-block; padding:0 4px; border-radius:3px; background:rgba(255,255,255,0.08); color:#aaa; font-size:10px; margin-left:3px; }
        .odd-tag.tag-tb { background: rgba(34,197,94,0.2); color:#86efac; }
        .odd-tag.tag-tm { background: rgba(239,68,68,0.2); color:#fca5a5; }
    </style>

    <style>
        .profit-cell { display: flex; align-items: center; gap: 10px; }
        .profit-val { white-space: nowrap; flex-shrink: 0; }
        .profit-spark { line-height: 0; }
        .spark { display: block; }
        .profit-table td { vertical-align: middle; }
    </style>
    <link rel="stylesheet" href="/assets/app-mobile.css">
</head>
<body>
    <div id="header-mount"></div>

    <main class="r-container" style="padding: 16px 12px;">
        <a href="javascript:history.length>1?history.back():(location.href='/leagues.html')" class="g-back">
            <i class="fas fa-arrow-left"></i> Назад
        </a>
        <nav style="display:flex;gap:12px;margin-bottom:12px;font-size:0.85em;">
            <a href="/" style="color:var(--text-muted)"><i class="fas fa-home"></i> Главная</a>
            <a href="/strategies.html" style="color:var(--text-muted)"><i class="fas fa-chess"></i> Стратегии</a>
            <a href="/predictions-history.html" style="color:var(--text-muted)"><i class="fas fa-chart-line"></i> Прогнозы</a>
        </nav>

        <div id="matchHeader">
            <div class="r-loading"><div class="r-spinner"></div><div>Загрузка матча…</div></div>
        </div>

        <div id="tabsWrap" style="display:none;">
            <div class="g-tabs" role="tablist">
                <button class="g-tab active" data-tab="events">События<span class="g-tab-count" id="cntEvents">0</span></button>
                <button class="g-tab" data-tab="lineups">Состав<span class="g-tab-count" id="cntLineups">0</span></button>
                <button class="g-tab" data-tab="stats">Статистика<span class="g-tab-count" id="cntStats">0</span></button>
                <button class="g-tab" data-tab="h2h">H2H<span class="g-tab-count" id="cntH2H">0</span></button>
                <button class="g-tab" data-tab="form">Форма<span class="g-tab-count" id="cntForm">0</span></button>
                <button class="g-tab" data-tab="profit">Прибыль<span class="g-tab-count" id="cntProfit">0</span></button>
                <button class="g-tab" data-tab="analyzers">Анализаторы<span class="g-tab-count" id="cntAnalyzers">0</span></button>
            </div>

            <div class="r-card r-card-padded">
                <div class="g-tab-content active" id="tab-events">
                    <div class="r-loading"><div class="r-spinner"></div></div>
                </div>
                <div class="g-tab-content" id="tab-lineups">
                    <div class="r-loading"><div class="r-spinner"></div></div>
                </div>
                <div class="g-tab-content" id="tab-stats">
                    <div class="r-loading"><div class="r-spinner"></div></div>
                </div>
                <div class="g-tab-content" id="tab-h2h">
                    <div id="h2hContent"><div class="r-loading"><div class="r-spinner"></div></div></div>
                </div>
                <div class="g-tab-content" id="tab-form">
                    <div class="filters-bar">
                        <label>Матчей:
                            <select id="formN" class="filter-select">
                                <option value="10">10</option>
                                <option value="15">15</option>
                                <option value="20" selected>20</option>
                                <option value="25">25</option>
                                <option value="30">30</option>
                                <option value="35">35</option>
                                <option value="40">40</option>
                                <option value="45">45</option>
                                <option value="50">50</option>
                            </select>
                        </label>
                        <label class="filter-check">
                            <input type="checkbox" id="formLeague"> Только текущая лига
                        </label>
                    </div>
                    <div id="formContent"><div class="r-loading"><div class="r-spinner"></div></div></div>
                </div>
                <div class="g-tab-content" id="tab-profit">
                    <div class="filters-bar">
                        <label>Матчей:
                            <select id="profitN" class="filter-select">
                                <option value="10">10</option>
                                <option value="15">15</option>
                                <option value="20" selected>20</option>
                                <option value="25">25</option>
                                <option value="30">30</option>
                                <option value="35">35</option>
                                <option value="40">40</option>
                                <option value="45">45</option>
                                <option value="50">50</option>
                            </select>
                        </label>
                        <label class="filter-check">
                            <input type="checkbox" id="profitLeague"> Только текущая лига
                        </label>
                    </div>
                    <div id="profitContent"><div class="r-loading"><div class="r-spinner"></div></div></div>
                </div>
                <div class="g-tab-content" id="tab-analyzers">
                    <div class="filters-bar">
                        <label>Матчей:
                            <select id="analyzersN" class="filter-select">
                                <option value="10">10</option>
                                <option value="15">15</option>
                                <option value="20" selected>20</option>
                                <option value="30">30</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </label>
                        <label class="filter-check">
                            <input type="checkbox" id="analyzersLeague" checked> Только текущая лига
                        </label>
                        <label class="filter-check">
                            <input type="checkbox" id="analyzersVenue" checked> Учитывать дом/гости
                        </label>
                    </div>
                    <div id="analyzersContent"><div class="r-loading"><div class="r-spinner"></div></div></div>
                </div>
            </div>
        </div>
    </main>

    <script src="/assets/app.js?v=3"></script>
    <script src="/assets/components.js"></script>
    <script>
    (function () {
        'use strict';
        const { api, fmt, ui, components: C, ws: RolgiWS } = window.Rolgi;

        // ── Header ──
        document.getElementById('header-mount').innerHTML = C.header('');

        // ── State ──
        const params = new URLSearchParams(location.search);
        const gameId = parseInt(params.get('id'), 10);
        let game = null;       // данные шапки матча (REST формат, snake_case)
        let wsClient = null;

        if (!gameId) {
            document.getElementById('matchHeader').innerHTML =
                C.errorBox('Не указан ID матча (нужен параметр ?id=...)');
            return;
        }

        // ── Helpers ──
        function teamLogo(url, name) {
            if (url) {
                return `<img src="${fmt.escapeHtml(url)}" alt="${fmt.escapeHtml(name||'')}" onerror="this.replaceWith(document.createTextNode('⚽'))">`;
            }
            return '<i class="fas fa-shield-halved"></i>';
        }

        function formatDateRu(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return d.toLocaleString('ru-RU', {
                day: '2-digit', month: 'long', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        // ── Render header (работает с REST snake_case) ──
        function renderHeader(g) {
            const st = fmt.gameStatus(g.status, g.is_live, g.is_finished);
            const flag = fmt.countryFlagByName(g.league_country);
            const isScheduled = st.kind === 'scheduled';
            const isLive = st.kind === 'live';
            const hs = g.home_score, as = g.away_score;
            const hht = g.home_score_ht, aht = g.away_score_ht;

            let scoreCls = '';
            let scoreHtml;
            if (isScheduled || hs == null) {
                scoreCls = 'g-score-scheduled';
                scoreHtml = `<div class="g-score ${scoreCls}">— : —</div>
                             <div class="g-score-ht">${fmt.time(g.date)}</div>`;
            } else {
                if (isLive) scoreCls = 'g-score-live';
                const htBlock = (hht != null && aht != null)
                    ? `<div class="g-score-ht">1Т: ${hht} : ${aht}</div>` : '';
                scoreHtml = `<div class="g-score ${scoreCls}" id="scoreMain">${hs} : ${as}</div>${htBlock}`;
            }

            const meta = [];
            if (g.stadium)    meta.push(`<div><i class="fas fa-location-dot"></i>${fmt.escapeHtml(g.stadium)}</div>`);
            if (g.referee)    meta.push(`<div><i class="fas fa-whistle"></i>${fmt.escapeHtml(g.referee)}</div>`);
            if (g.attendance) meta.push(`<div><i class="fas fa-users"></i>${Number(g.attendance).toLocaleString('ru-RU')}</div>`);
            if (g.round)      meta.push(`<div><i class="fas fa-hashtag"></i>Тур ${g.round}</div>`);

            const html = `
                <div class="g-league-row">
                    <span class="g-flag">${flag}</span>
                    <span class="g-league-name">${fmt.escapeHtml(g.league_name || '—')}</span>
                    <span class="g-dot">•</span>
                    <span>${fmt.escapeHtml(g.league_country || '')}</span>
                    <span class="g-dot">•</span>
                    <span>${formatDateRu(g.date)}</span>
                </div>
                <div class="g-match-card">
                    <div class="g-match-main">
                        <div class="g-team">
                            <div class="g-team-logo">${teamLogo(g.home_logo, g.home_name)}</div>
                            <div class="g-team-name">${fmt.escapeHtml(g.home_name || '—')}</div>
                        </div>
                        <div class="g-score-block">
                            ${scoreHtml}
                            <div class="g-status-row">
                                <span class="r-status ${st.css}">${fmt.escapeHtml(st.label)}</span>
                                <span class="r-ws-indicator" id="wsInd"><span class="r-ws-dot"></span><span class="r-ws-text">…</span></span>
                            </div>
                        </div>
                        <div class="g-team">
                            <div class="g-team-logo">${teamLogo(g.away_logo, g.away_name)}</div>
                            <div class="g-team-name">${fmt.escapeHtml(g.away_name || '—')}</div>
                        </div>
                    </div>
                    ${meta.length ? `<div class="g-meta-row">${meta.join('')}</div>` : ''}
                </div>`;
            document.getElementById('matchHeader').innerHTML = html;
        }

        // ── Load main game data ──
        async function loadGame() {
            try {
                const r = await api.get('/api/db/games/' + gameId, {}, { cacheType: 'game' });
                if (!r.success || !r.data) throw new Error('Матч не найден');
                game = r.data;
                window.game = game;
                document.title = `${game.home_name} ${game.home_score ?? ''}:${game.away_score ?? ''} ${game.away_name} — Rolgi`;
                renderHeader(game);
                document.getElementById('tabsWrap').style.display = '';
            } catch (e) {
                document.getElementById('matchHeader').innerHTML =
                    C.errorBox('Не удалось загрузить матч: ' + e.message);
                throw e;
            }
        }

        // ── Events ──
        function classifyEvent(type, subtype) {
            const t = String(type || '').toLowerCase();
            const s = String(subtype || '').toLowerCase();
            if (t === 'goal' || s.includes('goal'))         return { cls: 'g-event-icon-goal',    icon: 'fa-futbol',         label: subtype || 'Гол' };
            if (s.includes('penalty'))                       return { cls: 'g-event-icon-goal',    icon: 'fa-futbol',         label: 'Пенальти' };
            if (s.includes('own goal'))                      return { cls: 'g-event-icon-goal',    icon: 'fa-futbol',         label: 'Автогол' };
            if (t === 'card' && s.includes('yellow'))        return { cls: 'g-event-icon-yellow',  icon: 'fa-square',         label: 'Жёлтая карточка' };
            if (t === 'card' && (s.includes('red') || s.includes('second'))) return { cls: 'g-event-icon-red', icon: 'fa-square', label: 'Красная карточка' };
            if (t === 'substitution' || s.includes('substitution')) return { cls: 'g-event-icon-sub', icon: 'fa-arrows-rotate', label: 'Замена' };
            return { cls: 'g-event-icon-default', icon: 'fa-circle-info', label: subtype || type || 'Событие' };
        }

        function renderEvents(rows) {
            const wrap = document.getElementById('tab-events');
            if (!rows || !rows.length) {
                wrap.innerHTML = '<div class="g-empty">Событий пока нет</div>';
                document.getElementById('cntEvents').textContent = 0;
                return;
            }
            document.getElementById('cntEvents').textContent = rows.length;

            const html = rows.map(e => {
                const info = classifyEvent(e.type, e.subtype);
                const minute = e.minute_extra
                    ? `${e.minute}+${e.minute_extra}`
                    : `${e.minute ?? ''}'`;
                const player = fmt.escapeHtml(e.player_name || '—');
                let detail = fmt.escapeHtml(info.label);
                if (e.assist_player_name && (e.type === 'goal' || e.type === 'substitution')) {
                    const lbl = e.type === 'substitution' ? 'вышел вместо' : 'ассист';
                    detail += ` • ${lbl}: ${fmt.escapeHtml(e.assist_player_name)}`;
                }
                const block = `
                    <span class="g-event-icon ${info.cls}"><i class="fas ${info.icon}"></i></span>
                    <span class="g-event-text">
                        <div class="g-event-player">${player}</div>
                        <div class="g-event-detail">${detail}</div>
                    </span>`;
                if (e.side === 'home') {
                    return `<div class="g-event">
                        <div class="g-event-side g-event-side-home">${block}</div>
                        <div class="g-event-minute">${minute}</div>
                        <div class="g-event-side g-event-empty"></div>
                    </div>`;
                } else if (e.side === 'away') {
                    return `<div class="g-event">
                        <div class="g-event-side g-event-empty"></div>
                        <div class="g-event-minute">${minute}</div>
                        <div class="g-event-side g-event-side-away">${block}</div>
                    </div>`;
                } else {
                    return `<div class="g-event">
                        <div class="g-event-side g-event-empty"></div>
                        <div class="g-event-minute">${minute}</div>
                        <div class="g-event-side g-event-side-away">${block}</div>
                    </div>`;
                }
            }).join('');
            wrap.innerHTML = html;
        }

        async function loadEvents() {
            try {
                const r = await api.get('/api/db/games/' + gameId + '/events', {}, { cacheType: 'game' });
                renderEvents(r.data || []);
            } catch (e) {
                document.getElementById('tab-events').innerHTML =
                    `<div class="g-empty">⚠ ${fmt.escapeHtml(e.message)}</div>`;
            }
        }

        // ── Lineups ──
        function renderLineupTeam(teamName, side, group) {
            const renderPlayer = (p) => {
                const num = (p.shirt_number != null) ? p.shirt_number : '';
                const pos = p.lineup_position || p.player_position || '';
                const cap = p.is_captain ? ' <span class="g-player-cap" title="Капитан">(К)</span>' : '';
                let marks = '';
                if (p.substituted_in_minute != null) {
                    marks += `<span title="Вышел на замену"><i class="fas fa-arrow-up" style="color:var(--success-color)"></i> ${p.substituted_in_minute}'</span>`;
                }
                if (p.substituted_out_minute != null) {
                    marks += `<span title="Заменён"><i class="fas fa-arrow-down" style="color:var(--danger-color)"></i> ${p.substituted_out_minute}'</span>`;
                }
                return `<div class="g-player">
                    <span class="g-player-num">${num}</span>
                    <span class="g-player-name">${fmt.escapeHtml(p.player_name || '—')}${cap}</span>
                    ${pos ? `<span class="g-player-pos">${fmt.escapeHtml(pos)}</span>` : ''}
                    ${marks ? `<span class="g-player-marks">${marks}</span>` : ''}
                </div>`;
            };
            const starters = (group.starters || []).map(renderPlayer).join('');
            const subs     = (group.substitutes || []).map(renderPlayer).join('');
            return `<div class="g-lineup-team">
                <h3>${fmt.escapeHtml(teamName)}</h3>
                ${starters ? `<div class="g-lineup-section-title">Стартовый состав (${group.starters.length})</div>${starters}` : ''}
                ${subs     ? `<div class="g-lineup-section-title">Замены (${group.substitutes.length})</div>${subs}` : ''}
                ${(!starters && !subs) ? '<div class="g-empty" style="padding:20px 10px">Состав не опубликован</div>' : ''}
            </div>`;
        }

        function renderLineups(data) {
            const wrap = document.getElementById('tab-lineups');
            if (!data || (!data.home && !data.away)) {
                wrap.innerHTML = '<div class="g-empty">Составы не опубликованы</div>';
                return;
            }
            const total = (data.home?.starters?.length || 0) + (data.home?.substitutes?.length || 0)
                        + (data.away?.starters?.length || 0) + (data.away?.substitutes?.length || 0);
            document.getElementById('cntLineups').textContent = total;
            if (total === 0) {
                wrap.innerHTML = '<div class="g-empty">Составы не опубликованы</div>';
                return;
            }
            wrap.innerHTML = `<div class="g-lineups-grid">
                ${renderLineupTeam(game?.home_name || 'Хозяева', 'home', data.home || {})}
                ${renderLineupTeam(game?.away_name || 'Гости',   'away', data.away || {})}
            </div>`;
        }

        async function loadLineups() {
            try {
                const r = await api.get('/api/db/games/' + gameId + '/lineups', {}, { cacheType: 'game' });
                renderLineups(r.data);
            } catch (e) {
                document.getElementById('tab-lineups').innerHTML =
                    `<div class="g-empty">⚠ ${fmt.escapeHtml(e.message)}</div>`;
            }
        }

        // ── Statistics ──
        function renderStats(data) {
            const wrap = document.getElementById('tab-stats');
            if (!data || !data.metrics || !data.metrics.length) {
                wrap.innerHTML = '<div class="g-empty">Статистика недоступна</div>';
                return;
            }
            document.getElementById('cntStats').textContent = data.metrics.length;

            const html = data.metrics.map(m => {
                const h = m.home == null ? 0 : Number(m.home);
                const a = m.away == null ? 0 : Number(m.away);
                const total = h + a;
                const hPct = total > 0 ? (h / total) * 100 : 50;
                const aPct = total > 0 ? (a / total) * 100 : 50;
                const fmtVal = v => {
                    if (v == null) return '—';
                    return Number.isInteger(Number(v)) ? String(v) : Number(v).toFixed(2);
                };
                return `<div class="g-stat-row">
                    <div class="g-stat-val g-stat-val-home">${fmtVal(m.home)}</div>
                    <div class="g-stat-mid">
                        <div class="g-stat-label">${fmt.escapeHtml(m.label)}</div>
                        <div class="g-stat-bar">
                            <span class="g-stat-bar-home" style="width:${hPct}%"></span>
                            <span class="g-stat-bar-away" style="width:${aPct}%"></span>
                        </div>
                    </div>
                    <div class="g-stat-val g-stat-val-away">${fmtVal(m.away)}</div>
                </div>`;
            }).join('');
            wrap.innerHTML = html;
        }

        async function loadStats() {
            try {
                const r = await api.get('/api/db/games/' + gameId + '/statistics', {}, { cacheType: 'game' });
                renderStats(r.data);
            } catch (e) {
                document.getElementById('tab-stats').innerHTML =
                    `<div class="g-empty">⚠ ${fmt.escapeHtml(e.message)}</div>`;
            }
        }

        function renderH2H(data) {
            const wrap = document.getElementById('h2hContent');
            const games = (data && data.games) || [];
            const sum = (data && data.summary) || {};
            if (!games.length) { wrap.innerHTML = '<div class="g-empty">Личные встречи отсутствуют</div>'; return; }
            document.getElementById('cntH2H').textContent = games.length;
            const head = `<div class="g-h2h-summary" style="display:flex;justify-content:space-around;gap:10px;padding:10px;background:var(--card-bg);border-radius:8px;margin-bottom:12px;text-align:center;">
                <div><div style="font-size:1.5em;font-weight:700;color:#22c55e;">${sum.home_team_wins||0}</div><div style="font-size:0.85em;color:var(--text-muted);">Победы 1</div></div>
                <div><div style="font-size:1.5em;font-weight:700;color:#6b7280;">${sum.draws||0}</div><div style="font-size:0.85em;color:var(--text-muted);">Ничьи</div></div>
                <div><div style="font-size:1.5em;font-weight:700;color:#ef4444;">${sum.away_team_wins||0}</div><div style="font-size:0.85em;color:var(--text-muted);">Победы 2</div></div>
                <div><div style="font-size:1.5em;font-weight:700;">${sum.total||0}</div><div style="font-size:0.85em;color:var(--text-muted);">Всего</div></div>
            </div>`;
            const rows = games.map(g => {
                const dateStr = formatDateRu(g.date);
                const score = (g.home_score != null && g.away_score != null) ? `${g.home_score} - ${g.away_score}` : '—';
                return `<div class="g-h2h-row" style="display:grid;grid-template-columns:minmax(60px, 1fr) 1fr minmax(40px, auto) 1fr;gap:8px;padding:10px;border-bottom:1px solid var(--border-color);align-items:center;font-size:0.92em;">
                    <div style="color:var(--text-muted);font-size:0.85em;">${fmt.escapeHtml(dateStr)}</div>
                    <div style="text-align:right;">${fmt.escapeHtml(g.home_name||'')}</div>
                    <div style="text-align:center;font-weight:700;font-variant-numeric:tabular-nums;">${score}</div>
                    <div>${fmt.escapeHtml(g.away_name||'')}</div>
                </div>`;
            }).join('');
            wrap.innerHTML = head + `<div class="g-h2h-games">${rows}</div>`;
        }

        async function loadH2H() {
            try {
                const r = await api.get('/api/db/games/' + gameId + '/h2h', { limit: 20 }, { cacheType: 'game' });
                renderH2H(r.data);
            } catch (e) {
                document.getElementById('h2hContent').innerHTML = `<div class="g-empty">⚠ ${fmt.escapeHtml(e.message)}</div>`;
            }
        }

        function renderForm(data, label) {
            if (!data) return '<div class="form-block"><div class="form-title">' + label + '</div><div class="r-empty">Нет данных</div></div>';
            const games = data.games || [];
            const sm = data.summary || {};
            const winPct = sm.played ? Math.round(100 * sm.wins / sm.played) : 0;

            // Цепочка W/D/L (последние 10)
            const chain = games.slice(0, 10).map(g => {
                const oc = g.outcome || '?';
                const cls = oc === 'W' ? 'oc-w' : (oc === 'L' ? 'oc-l' : (oc === 'D' ? 'oc-d' : 'oc-x'));
                return '<span class="oc ' + cls + '">' + oc + '</span>';
            }).join('');

            const fmtOdd = (v) => v == null ? '<span class="r-muted">—</span>' : Number(v).toFixed(2);
            const winnerOdd = (g) => {
                // Какой кэф был "победным" по 1X2
                if (g.home_score == null || g.away_score == null) return '—';
                if (g.home_score > g.away_score) return fmtOdd(g.odd_home) + ' <span class="odd-tag">П1</span>';
                if (g.home_score < g.away_score) return fmtOdd(g.odd_away) + ' <span class="odd-tag">П2</span>';
                return fmtOdd(g.odd_draw) + ' <span class="odd-tag">X</span>';
            };
            const totalWinner = (g) => {
                if (g.home_score == null || g.away_score == null) return '—';
                const t = g.home_score + g.away_score;
                if (t > 2) return fmtOdd(g.odd_over25) + ' <span class="odd-tag tag-tb">ТБ</span>';
                return fmtOdd(g.odd_under25) + ' <span class="odd-tag tag-tm">ТМ</span>';
            };
            const renderGoals = (g) => {
                const goals = g.goals || [];
                if (!goals.length) return '<span class="r-muted">—</span>';
                return goals.map(x => {
                    const mn = x.minute + (x.minute_extra ? '+' + x.minute_extra : '');
                    const cls = x.team_side === 'home' ? 'goal-home' : 'goal-away';
                    return '<span class="goal-min ' + cls + '">' + mn + "'</span>";
                }).join(' ');
            };

            let rows = '';
            for (const g of games) {
                const dateStr = g.date ? new Date(g.date).toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'}) : '';
                const isHome = g.side === 'home';
                const isWin = (isHome && g.home_score > g.away_score) || (!isHome && g.away_score > g.home_score);
                const isLoss = (isHome && g.home_score < g.away_score) || (!isHome && g.away_score < g.home_score);
                const isDraw = g.home_score === g.away_score;
                const rowCls = isWin ? 'row-win' : (isLoss ? 'row-loss' : (isDraw ? 'row-draw' : ''));
                rows += '<tr class="' + rowCls + '">' +
                    '<td class="form-date">' + dateStr + '</td>' +
                    '<td class="form-teams">' +
                        '<span class="' + (isHome ? 'team-self' : '') + '">' + (g.home_name || '') + '</span>' +
                        ' <b>' + (g.home_score ?? '-') + ':' + (g.away_score ?? '-') + '</b> ' +
                        '<span class="' + (!isHome ? 'team-self' : '') + '">' + (g.away_name || '') + '</span>' +
                    '</td>' +
                    '<td class="form-goals">' + renderGoals(g) + '</td>' +
                    '<td class="form-odd">' + winnerOdd(g) + '</td>' +
                    '<td class="form-odd">' + totalWinner(g) + '</td>' +
                '</tr>';
            }

            return '<div class="form-block">' +
                '<div class="form-title">' +
                    '<span>' + label + '</span>' +
                    '<span class="form-chain">' + chain + '</span>' +
                    '<span class="r-muted">' + (sm.wins||0) + 'W·' + (sm.draws||0) + 'D·' + (sm.losses||0) + 'L · ' +
                        (sm.goals_for||0) + ':' + (sm.goals_against||0) + ' · ' + winPct + '%</span>' +
                '</div>' +
                '<div class="table-wrap"><table class="form-table">' +
                    '<thead><tr>' +
                        '<th>Дата</th><th>Матч</th><th>Голы</th><th>Исход</th><th>Тотал</th>' +
                    '</tr></thead>' +
                    '<tbody>' + rows + '</tbody>' +
                '</table></div>' +
            '</div>';
        }

        window.loadForm = async function () {
            try {
                const homeTeamId = (window.game && window.game.home_team_id) || (homeData && homeData.id);
                const awayTeamId = (window.game && window.game.away_team_id) || (awayData && awayData.id);
                const homeName = (window.game && window.game.home_name) || (homeData && homeData.name) || 'Хозяева';
                const awayName = (window.game && window.game.away_name) || (awayData && awayData.name) || 'Гости';
                if (!homeTeamId || !awayTeamId) {
                    document.getElementById('formContent').innerHTML = '<div class="r-empty">Нет данных о командах</div>';
                    return;
                }

                const nSel = document.getElementById('formN');
                const lgSel = document.getElementById('formLeague');
                const n = nSel ? parseInt(nSel.value, 10) : 20;
                const useLeague = lgSel ? lgSel.checked : false;
                const leagueId = (window.game && window.game.league_id) || null;

                document.getElementById('formContent').innerHTML = '<div class="r-loading"><div class="r-spinner"></div></div>';

                const params = { limit: n };
                if (useLeague && leagueId) params.league_id = leagueId;

        // ── WebSocket ──
        function applyWsGame(wsGame) {
            // wsGame от snapshot/update приходит в camelCase: homeTeam:{score}, awayTeam:{score}, status
            // мерджим в game (snake_case)
            if (!game || !wsGame) return;
            const prevHome = game.home_score;
            const prevAway = game.away_score;
            let changed = false;

            if (wsGame.homeTeam && wsGame.homeTeam.score != null && wsGame.homeTeam.score !== game.home_score) {
                game.home_score = wsGame.homeTeam.score;
                changed = true;
            }
            if (wsGame.awayTeam && wsGame.awayTeam.score != null && wsGame.awayTeam.score !== game.away_score) {
                game.away_score = wsGame.awayTeam.score;
                changed = true;
            }
            if (wsGame.status && wsGame.status !== game.status) {
                game.status = wsGame.status;
                if (wsGame.statusInfo) {
                    game.is_live     = !!wsGame.statusInfo.isLive;
                    game.is_finished = !!wsGame.statusInfo.isFinished;
                }
                changed = true;
            }

            if (!changed) return;
            renderHeader(game);
            // flash + toast при изменении счёта
            const goalHome = (prevHome != null && game.home_score > prevHome);
            const goalAway = (prevAway != null && game.away_score > prevAway);
            if (goalHome || goalAway) {
                const el = document.getElementById('scoreMain');
                if (el) ui.flash(el);
                const teamName = goalHome ? (game.home_name||'Хозяева') : (game.away_name||'Гости');
                ui.toast(`ГОЛ! ${teamName} • ${game.home_score} : ${game.away_score}`, { emoji: '⚽' });
            }
        }

        function setupWS() {
            // WS-FINISHED-GUARD: не подключаем WS для завершённых матчей
            if (game && game.is_finished) {
                const _el = document.getElementById('wsInd');
                if (_el) _el.style.display = 'none';
                return;
            }
            wsClient = new RolgiWS({
                onStatus: (s) => ui.setWSStatus(document.getElementById('wsInd'), s)
            });
            wsClient.connect();
            wsClient.subscribe('game:' + gameId, (msg) => {
                // msg может быть snapshot или game:update
                const payload = msg.data || {};
                if (payload.game) applyWsGame(payload.game);

                // Если матч завершился — перезагрузить все REST через 3 сек,
                // чтобы подтянулись финальные события/статистика
                const evType = payload.eventType;
                if ((evType === 'game_finished' || msg.type === 'game:finished') && !window.__finishedReloaded) {
                    window.__finishedReloaded = true;
                    setTimeout(() => {
                        loadGame().catch(()=>{});
                        loadEvents();
                        loadStats();
                    }, 3000);
                }
            });
        }

            // SVG спарклайн нарастающего профита
            function sparkline(series, color) {
                if (!Array.isArray(series) || series.length < 2) {
                    return '<svg width="100" height="22"></svg>';
                }
                const W = 100, H = 22, P = 2;
                const min = Math.min(0, ...series);
                const max = Math.max(0, ...series);
                const range = (max - min) || 1;
                const stepX = (W - 2 * P) / (series.length - 1);
                const yOf = (v) => H - P - ((v - min) / range) * (H - 2 * P);
                const points = series.map((v, i) => (P + i * stepX).toFixed(1) + ',' + yOf(v).toFixed(1)).join(' ');
                const zeroY = yOf(0).toFixed(1);
                const last = series[series.length - 1];
                const lastX = (W - P).toFixed(1);
                const lastY = yOf(last).toFixed(1);
                const lastColor = last > 0 ? '#22c55e' : (last < 0 ? '#ef4444' : '#888');
                return '<svg width="' + W + '" height="' + H + '" class="spark">' +
                    '<line x1="0" y1="' + zeroY + '" x2="' + W + '" y2="' + zeroY + '" stroke="rgba(255,255,255,0.1)" stroke-dasharray="2,2"/>' +
                    '<polyline fill="none" stroke="' + color + '" stroke-width="1.5" points="' + points + '"/>' +
                    '<circle cx="' + lastX + '" cy="' + lastY + '" r="2" fill="' + lastColor + '"/>' +

        // Popover state
        let _anzPopoverEl = null;
        function closeAnzPopover() {
            if (_anzPopoverEl) {
                _anzPopoverEl.classList.remove('open');
                _anzPopoverEl = null;
            }
        }
        function openAnzPopover(triggerEl, helpKey) {
            closeAnzPopover();
            const help = ANZ_HELP[helpKey];
            if (!help) return;
            let pop = document.getElementById('anzPopover');
            if (!pop) {
                pop = document.createElement('div');
                pop.id = 'anzPopover';
                pop.className = 'anz-popover';
                document.body.appendChild(pop);
            }
            const rowsHtml = help.rows.map(r => '<div class="anz-popover-row">' + r + '</div>').join('');
            pop.innerHTML =
                '<span class="anz-popover-close" onclick="closeAnzPopover()">×</span>' +
                '<div class="anz-popover-title">' + help.title + '</div>' +
                rowsHtml;
            // Позиционирование: рядом с триггером, но в пределах viewport
            const rect = triggerEl.getBoundingClientRect();
            const pad = 6;
            // Сначала пробуем справа от триггера
            let left = rect.right + pad;
            let top = rect.top - 8;
            // Если справа не помещается — слева
            pop.classList.add('open');
            const popRect = pop.getBoundingClientRect();
            if (left + popRect.width > window.innerWidth - 8) {
                left = rect.left - popRect.width - pad;
            }
            // Если слева тоже не помещается — снизу под триггером
            if (left < 8) {
                left = 8;
                top = rect.bottom + pad;
            }
            // Корректируем top, чтобы не вылезал снизу экрана
            if (top + popRect.height > window.innerHeight - 8) {
                top = window.innerHeight - popRect.height - 8;
            }
            if (top < 8) top = 8;
            pop.style.left = left + 'px';
            pop.style.top = top + 'px';
            _anzPopoverEl = pop;
        }
        // Expose to inline handlers
        window.closeAnzPopover = closeAnzPopover;
        // Глобальный клик закрывает popover (если кликнули не по нему и не по триггеру)
        document.addEventListener('click', (e) => {
            if (!_anzPopoverEl) return;
            if (e.target.classList && e.target.classList.contains('anz-help')) return;
            if (_anzPopoverEl.contains(e.target)) return;

                    const interp = d.interpretation || '';
                    valueHtml = pc + ' пик' + (pc === 1 ? '' : (pc < 5 && pc > 0 ? 'а' : 'ов'));
                    if (interp) extra = '<div class="anz-metric-conf">' + interp.replace(/_/g, ' ') + '</div>';
                } else if (key === 'form_inertia' && d.trend) {
                    extra = '<div class="anz-metric-conf">' + d.trend + ', lag1=' + fmtN(d.lag1_corr, 2) + '</div>';
                } else if (key === 'shannon_entropy' && d.total_goals_stats) {
                    extra = '<div class="anz-metric-conf">avg ' + fmtN(d.total_goals_stats.mean, 1) + ' голов</div>';
                } else if (key === 'markov_state' && d.current_state) {
                    extra = '<div class="anz-metric-conf">state: ' + d.current_state + '</div>';
                } else if (key === 'hmm') {
                    if (d.degenerate_fit) {
                        valueHtml = '<span class="anz-metric-conf">⚠ вырожденная модель</span>';
                    } else if (d.current_state_label) {
                        const stateLabels = ['WEAK', 'AVG', 'STRONG', 'EXCELLENT'];
                        const stateIdx = stateLabels.indexOf(d.current_state_label);
                        const stateColors = ['#ef4444', '#f59e0b', '#22c55e', '#3b82f6'];
                        const color = stateIdx >= 0 ? stateColors[stateIdx] : '#888';
                        valueHtml = '<span style="color:' + color + ';font-weight:700">' + d.current_state_label + '</span>';
                        const stab = d.stability != null ? 'стабильность ' + fmtPct(d.stability) : '';
                        const domShare = d.dominant_state_share != null ? 'доминирование ' + fmtPct(d.dominant_state_share) : '';
                        const expLvl = d.expected_next_level != null ? 'ожид.уровень ' + fmtN(d.expected_next_level, 1) : '';
                        extra = '<div class="anz-metric-conf">' + [stab, domShare, expLvl].filter(Boolean).join(', ') + '</div>';
                    } else {
                        valueHtml = '<span class="anz-metric-conf">нет данных</span>';
                    }
                } else if (key === 'valenzetti' && d.lambda_home != null) {
                    const probs = d.probabilities || {};
                    valueHtml = 'λ=' + fmtN(d.lambda_home, 2) + '/' + fmtN(d.lambda_away, 2);
                    const factorsInfo = d.factors ? 'F: [' + d.factors.home.map(v => fmtN(v,2)).join(',') + ']' : '';
                    if (d.entropy != null) {
                        extra = '<div class="anz-metric-conf">H=' + fmtPct(d.entropy) + ' conf=' + fmtPct(d.confidence_level) + '</div>';
                    }
                    if (probs.home != null) {
                        extra += '<div class="anz-metric-conf">' +
                            'П1 ' + fmtPct(probs.home) + ' X ' + fmtPct(probs.draw) + ' П2 ' + fmtPct(probs.away) +
                            '</div>';
                    }
                    if (factorsInfo) {
                        extra += '<div class="anz-metric-conf" style="font-size:0.8em">' + factorsInfo + '</div>';
                    }
                }

                rows.push(
                    '<div class="anz-metric-row">' +
                        '<div class="anz-metric-name">' + (ANZ_LABELS[key] || key) + helpIcon(key) + '</div>' +
                        '<div class="anz-metric-value">' + valueHtml + conf + extra + '</div>' +
                    '</div>'
                );
            }
            const logoHtml = teamLogo
                ? '<img src="' + fmt.escapeHtml(teamLogo) + '" onerror="this.style.display=\'none\'">'
                : '<i class="fas fa-shield-halved"></i>';
            return (
                '<div class="anz-card">' +
                    '<div class="anz-card-header">' + logoHtml + ' ' + fmt.escapeHtml(teamName || '?') + '</div>' +
                    rows.join('') +
                '</div>'
            );
        }

        function renderBetCard(side, label, betData) {
            if (!betData) {
                return '<div class="anz-bet-card skip"><div class="anz-bet-side">' + label + '</div><div class="anz-bet-edge">нет коэф</div></div>';
            }
            const d = betData.details || {};
            if (d.error) {
                return '<div class="anz-bet-card skip"><div class="anz-bet-side">' + label + '</div><div class="anz-bet-edge">' + d.error + '</div></div>';
            }
            const odds = d.odds || 0;
            const edge = d.edge_per_bet || 0;
            const kelly = d.kelly_fraction || 0;
            const rec = (d.recommendation || 'SKIP');
            const klass = recClass(rec);
            const edgeClass = edge >= 0 ? 'pos' : 'neg';
            const edgeSign = edge >= 0 ? '+' : '';
            return (
                '<div class="anz-bet-card ' + klass + '">' +
                    '<div class="anz-bet-side">' + label + '</div>' +
                    '<div class="anz-bet-odds">' + odds.toFixed(2) + '</div>' +
                    '<div class="anz-bet-edge ' + edgeClass + '">' + edgeSign + (edge * 100).toFixed(1) + '%</div>' +
                    '<div class="anz-bet-kelly">Kelly: ' + (kelly * 100).toFixed(1) + '%</div>' +
                    '<div class="anz-bet-rec ' + klass + '">' + rec + '</div>' +
                '</div>'
            );
        }

        function outcomeLabel(o, homeName, awayName) {
            if (o === 'HOME') return 'Победа ' + (homeName || 'дома');
            if (o === 'AWAY') return 'Победа ' + (awayName || 'гостей');
            if (o === 'DRAW') return 'Ничья';
            return o || '—';
        }

        function renderAnalyzers(data) {
            const el = document.getElementById('analyzersContent');
            if (!el) return;
            if (!data) {
                el.innerHTML = '<div class="r-empty">Нет данных для анализа</div>';
                return;
            }

            const homeName = data.game && data.game.home ? data.game.home.name : '';
            const homeLogo = data.game && data.game.home ? data.game.home.logo : null;
            const awayName = data.game && data.game.away ? data.game.away.name : '';
            const awayLogo = data.game && data.game.away ? data.game.away.logo : null;

            // Team cards
            const homeCard = renderTeamCard(homeName, homeLogo, data.home_analyzers || {});
            const awayCard = renderTeamCard(awayName, awayLogo, data.away_analyzers || {});

            // Betting cards
            const betting = data.betting || {};
            const betHome = renderBetCard('home', 'П1 ' + (homeName || ''), betting.home);
            const betDraw = renderBetCard('draw', 'X (ничья)', betting.draw);
            const betAway = renderBetCard('away', 'П2 ' + (awayName || ''), betting.away);

            // Integrated forecast
            const fc = data.integrated_forecast || {};
            const outLabel = outcomeLabel(fc.predicted_outcome, homeName, awayName);
            const conf = (fc.confidence || 0);
            const confPct = Math.min(100, Math.max(0, conf * 100));

            // Meta
            const cfg = data.config || {};
            const histSizes = data.history_sizes || {};
            const meta = 'N=' + (cfg.n_window || '?') +
                         ' • league=' + (cfg.league_filter_flag ? 'только этa' : 'все турниры') +
                         ' • venue=' + (cfg.venue_filter ? 'дом/гости' : 'смешано') +
                         ' • history: home=' + (histSizes.home_any || 0) + '/' + (histSizes.home_home || 0) +
                         ', away=' + (histSizes.away_any || 0) + '/' + (histSizes.away_away || 0);

            const html =
                '<div class="anz-section-title">Прогноз модели' + helpIcon('forecast') + '</div>' +
                '<div class="anz-forecast">' +
                    '<div class="anz-forecast-outcome">' + outLabel + '</div>' +
                    '<div class="anz-forecast-conf-bar"><div class="anz-forecast-conf-fill" style="width:' + confPct + '%"></div></div>' +
                    '<div class="anz-forecast-hint">Confidence: ' + fmtPct(conf) + '. Baseline-предиктор без учёта силы соперника.</div>' +
                '</div>' +
                '<div class="anz-section-title">Анализаторы команд</div>' +
                '<div class="anz-grid">' + homeCard + awayCard + '</div>' +
                '<div class="anz-section-title">Value bets ' + helpIcon('betting_edge') + helpIcon('betting_kelly') + '</div>' +
                '<div class="anz-betting">' + betHome + betDraw + betAway + '</div>' +
                '<div class="anz-meta">' + meta + '</div>';
            el.innerHTML = html;

            const cnt = document.getElementById('cntAnalyzers');
            if (cnt) cnt.textContent = (fc.predicted_outcome || '—').slice(0,1);
        }

        // Этап 12: рендер баннера записанного прогноза (если он есть в predictions_log)
        function renderRecordedPrediction(rec) {
            if (!rec) return;
            const esc = (Rolgi && Rolgi.fmt && Rolgi.fmt.escapeHtml) ? Rolgi.fmt.escapeHtml : (s => String(s == null ? '' : s));
            const predictedAt = new Date(rec.predicted_at);
            const ageMs = Date.now() - predictedAt.getTime();
            const ageHours = Math.max(0, Math.round(ageMs / (1000 * 60 * 60)));
            const ageDays = Math.max(0, Math.round(ageMs / (1000 * 60 * 60 * 24)));
            const ageStr = ageHours < 24 ? (ageHours + ' ч назад') : (ageDays + ' д назад');

            const outcomeLabels = { HOME: 'Победа дома (П1)', DRAW: 'Ничья (X)', AWAY: 'Победа гостей (П2)' };
            const outcomeColor = { HOME: '#1f618d', DRAW: '#666', AWAY: '#922b21' };
            const outcomeBg    = { HOME: '#d6eaf8', DRAW: '#e5e7e9', AWAY: '#f5b7b1' };
            const oc = rec.predicted_outcome;
            const conf = rec.confidence != null ? Math.round(rec.confidence * 100) + '%' : '—';

            let verdictHtml = '';
            if (rec.actual) {
                const a = rec.actual;
                const isHit = a.is_hit === true;
                const scoreStr = a.home_score + ':' + a.away_score;
                const actLabel = outcomeLabels[a.outcome] || a.outcome;
                verdictHtml = isHit
                    ? '<div class="rec-pred-actual hit">' +
                          '<i class="fas fa-check-circle"></i> ' +
                          'Факт: ' + esc(scoreStr) + ' — <b>' + esc(actLabel) + '</b>. Попали 🎯' +
                      '</div>'
                    : '<div class="rec-pred-actual miss">' +
                          '<i class="fas fa-times-circle"></i> ' +
                          'Факт: ' + esc(scoreStr) + ' — <b>' + esc(actLabel) + '</b>. Промах' +
                      '</div>';
            } else {
                verdictHtml = '<div class="rec-pred-actual pending">' +
                                  '<i class="fas fa-clock"></i> Матч ещё не сыгран — результат проверим автоматически' +
                              '</div>';
            }

            const html =
                '<div class="rec-pred-banner" style="background:#fffaf0;border-left:4px solid var(--r-accent,#f39c12);padding:12px 14px;border-radius:8px;margin-bottom:14px;">' +
                  '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">' +
                    '<i class="fas fa-bookmark" style="color:#f39c12;"></i>' +
                    '<b style="font-size:0.95em;">Записанный прогноз</b>' +
                    '<span style="color:#888;font-size:0.85em;">' + esc(ageStr) + '</span>' +
                    '<span style="margin-left:auto;background:' + (outcomeBg[oc] || '#eee') + ';color:' + (outcomeColor[oc] || '#333') + ';padding:3px 10px;border-radius:12px;font-weight:600;font-size:0.85em;">' +
                      esc(outcomeLabels[oc] || oc) + ' · ' + esc(conf) +
                    '</span>' +
                  '</div>' +
                  verdictHtml +
                  '<div style="font-size:0.8em;color:#888;margin-top:6px;">Сделан ' + predictedAt.toLocaleString('ru-RU') +
                    ' · n=' + rec.config.n_window + (rec.config.league_filter ? ' · в лиге' : '') + (rec.config.venue_filter ? ' · venue' : '') +
                  '</div>' +
                '</div>';

            const el = document.getElementById('analyzersContent');
            if (el) el.insertAdjacentHTML('afterbegin', html);
        }

        // Стили для verdict-блока баннера
        (function injectRecPredStyles() {
            if (document.getElementById('rec-pred-style')) return;
            const s = document.createElement('style');
            s.id = 'rec-pred-style';
            s.textContent = '.rec-pred-actual { margin-top: 8px; font-size: 0.9em; } '
                          + '.rec-pred-actual.hit { color: #27ae60; } '
                          + '.rec-pred-actual.miss { color: #c0392b; } '
                          + '.rec-pred-actual.pending { color: #888; font-style: italic; }';
            document.head.appendChild(s);
        })();

        window.loadAnalyzers = async function () {
            try {
                const nSel = document.getElementById('analyzersN');
                const lgSel = document.getElementById('analyzersLeague');
                const vnSel = document.getElementById('analyzersVenue');
                const n = nSel ? parseInt(nSel.value, 10) : 20;
                const useLeague = lgSel ? lgSel.checked : true;
                const useVenue = vnSel ? vnSel.checked : true;

                document.getElementById('analyzersContent').innerHTML = '<div class="r-loading"><div class="r-spinner"></div></div>';

                const params = { n: n };
                if (!useLeague) params.league_filter = 'false';
                if (!useVenue) params.venue_filter = 'false';
                const r = await api.get('/api/db/games/' + gameId + '/analyzers', params, { cacheType: 'game' });
                renderAnalyzers(r && r.data ? r.data : null);

                // Этап 12: подгрузить записанный прогноз и показать баннер
                try {
                    const pr = await api.get('/api/db/games/' + gameId + '/prediction', {}, { cacheType: 'game' });
                    if (pr && pr.success && pr.data) renderRecordedPrediction(pr.data);
                } catch (e) {
                    console.warn('recorded prediction load failed (non-critical):', e);
                }
            } catch (e) {
                const el = document.getElementById('analyzersContent');
                if (el) el.innerHTML = '<div class="r-empty">Ошибка загрузки анализаторов</div>';
                console.error('loadAnalyzers failed:', e);
            }
        };

                Promise.all([loadEvents(), loadLineups(), loadStats(), loadH2H(), window.loadForm(), window.loadProfit(), window.loadAnalyzers()]).catch(()=>{});
                attachFilterHandlers();
                setupWS();
            } catch (_) {
                // ошибка уже отрендерена
            }
        }

        // Cleanup WS on page leave
        window.addEventListener('beforeunload', () => {
            try { wsClient && wsClient.close(); } catch (_) {}
        });

        init();
    })();
    </script>
