<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лиги — Rolgi SStats</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/app.css">
    <style>
        .league-empty { text-align: center; padding: 40px 20px; color: var(--text-muted); }
        .r-filter-pills {
            display: flex; flex-wrap: wrap; gap: 6px;
            margin: 12px 0;
        }
        .r-pill {
            padding: 6px 14px;
            background: #f0f2f5;
            border: 1px solid transparent;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.88em;
            color: var(--text-color);
            transition: all 0.12s;
        }
        .r-pill:hover { background: #e4e8ed; }
        .r-pill.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }
        .r-pill .r-pill-count {
            display: inline-block;
            margin-left: 6px;
            background: rgba(255,255,255,0.25);
            padding: 1px 7px;
            border-radius: 10px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .r-pill:not(.active) .r-pill-count { background: rgba(0,0,0,0.08); }
        .r-load-more {
            display: block;
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            background: white;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            color: var(--primary-color);
            font-weight: 500;
            font-size: 0.95em;
            transition: all 0.12s;
        }
        .r-load-more:hover { background: #f8f9fa; border-color: var(--primary-color); }
        .r-load-more:disabled { color: var(--text-muted); cursor: default; }
        .league-pills { display:flex; flex-wrap:wrap; gap:6px; }
        .league-modal { max-width:100%; padding:8px; }
        @media (max-width: 640px) { .league-list { grid-template-columns: 1fr; } }
    </style>
    <link rel="stylesheet" href="/assets/app-mobile.css">
</head>
<body>
    <div id="header-mount"></div>

    <main class="r-container">
        <div class="r-card r-card-padded">
            <h1 style="margin: 0 0 16px; font-size: 1.4em;">
                <i class="fas fa-trophy" style="color: var(--secondary-color); margin-right: 8px;"></i>
                Футбольные лиги
                <span class="r-text-muted r-text-sm" style="font-weight:400; margin-left:8px;">из БД</span>
            </h1>

            <div class="r-tabs" id="tabs">
                <button class="r-tab active" data-tab="popular">⭐ Популярные</button>
                <button class="r-tab" data-tab="all">Все лиги</button>
            </div>

            <div class="r-search-row">
                <input type="text" id="searchInput" placeholder="🔍 Поиск по названию или стране…">
                <select id="countryFilter"><option value="">Все страны</option></select>
                <select id="sortBy">
                    <option value="name">По имени</option>
                    <option value="seasons">По сезонам</option>
                    <option value="country">По стране</option>
                </select>
            </div>

            <div id="resultsInfo" class="r-text-muted r-text-sm" style="margin-bottom: 12px;"></div>
            <div id="leaguesContent"><div class="r-loading"><div class="r-spinner"></div> Загрузка…</div></div>
        </div>
    </main>

    <div id="modal-mount"></div>

    <script src="/assets/app.js?v=4"></script>
    <script src="/assets/components.js?v=cappers1"></script>
    <script>
    (function(){
        const { api, fmt } = Rolgi;
        const C = Rolgi.components;
        const PAGE_SIZE = 50;

        document.getElementById('header-mount').innerHTML = C.header('leagues');
        document.getElementById('modal-mount').innerHTML  = C.modal('leagueModal');

        let allLeagues = [];
        let currentTab = 'popular';

        // Состояние открытой модалки (сезон)
        let modalState = null; // { league, year, summary, group, items, offset, exhausted }

        async function init() {
            try {
                const res = await api.get('/api/db/leagues', {}, { ttl: 300000 });
                allLeagues = (res && res.data) || [];
                populateCountryFilter();
                render();
            } catch (e) {
                document.getElementById('leaguesContent').innerHTML =
                    `<div class="league-empty">⚠ ${fmt.escapeHtml(e.message)}</div>`;
            }
        }

        function populateCountryFilter() {
            const set = new Set();
            allLeagues.forEach(l => l.country_name && set.add(l.country_name));
            const sel = document.getElementById('countryFilter');
            [...set].sort((a,b) => a.localeCompare(b)).forEach(name => {
                const opt = document.createElement('option');
                opt.value = name; opt.textContent = name;
                sel.appendChild(opt);
            });
        }

        function render() {
            const q  = document.getElementById('searchInput').value.trim().toLowerCase();
            const cc = document.getElementById('countryFilter').value;
            const sort = document.getElementById('sortBy').value;

            let items = allLeagues.filter(l => {
                if (cc && l.country_name !== cc) return false;
                if (q) {
                    const hay = ((l.name||'') + ' ' + (l.country_name||'')).toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });

            if (currentTab === 'popular' && !q && !cc) {
                items = items.filter(l => l.popular_rank).sort((a,b) => a.popular_rank - b.popular_rank);
            } else {
                if (sort === 'seasons') items.sort((a,b) => (b.seasons||[]).length - (a.seasons||[]).length);
                else if (sort === 'country') items.sort((a,b) =>
                    (a.country_name||'').localeCompare(b.country_name||'') || (a.name||'').localeCompare(b.name||''));
                else items.sort((a,b) => (a.name||'').localeCompare(b.name||''));
            }

            document.getElementById('resultsInfo').textContent =
                `Найдено: ${items.length} из ${allLeagues.length}`;
            document.getElementById('leaguesContent').innerHTML = items.length
                ? items.map(C.leagueItemDb).join('')
                : `<div class="league-empty">Ничего не найдено</div>`;
        }

        document.getElementById('tabs').addEventListener('click', e => {
            const t = e.target.closest('[data-tab]'); if (!t) return;
            document.querySelectorAll('.r-tab').forEach(x => x.classList.remove('active'));
            t.classList.add('active');
            currentTab = t.dataset.tab;
            render();
        });
        let timer;
        document.getElementById('searchInput').addEventListener('input', () => {
            clearTimeout(timer); timer = setTimeout(render, 200);
        });
        document.getElementById('countryFilter').addEventListener('change', render);
        document.getElementById('sortBy').addEventListener('change', render);

        document.getElementById('leaguesContent').addEventListener('click', e => {
            const item = e.target.closest('[data-league-id]');
            if (!item) return;
            openLeague(+item.dataset.leagueId, item.dataset.leagueName);
        });

        function openLeague(leagueId, leagueName) {
            modalState = null;
            const league = allLeagues.find(l => l.id === leagueId);
            if (!league) return;
            const seasons = [...(league.seasons || [])].sort((a,b) => (b.year||0) - (a.year||0));

            document.getElementById('leagueModal-title').textContent = leagueName;
            const body = document.getElementById('leagueModal-body');
            body.innerHTML = `
                <div class="r-text-muted r-text-sm" style="margin-bottom: 12px;">
                    ${fmt.countryFlagByName(league.country_name)} ${fmt.escapeHtml(league.country_name||'')}
                    · ${seasons.length} сезон${seasons.length === 1 ? '' : 'ов'}
                </div>
                ${seasons.length
                    ? seasons.map(C.seasonItemDb).join('')
                    : '<div class="league-empty">Сезонов нет</div>'}
            `;
            document.getElementById('leagueModal').classList.add('active');
            body.querySelectorAll('[data-season-year]').forEach(el => {
                el.addEventListener('click', () => openSeason(league, +el.dataset.seasonYear));
            });
        }

        // ─── Сезон с фильтрами и пагинацией ────────────────────────
        async function openSeason(league, year) {
            // По умолчанию выбираем разумную группу: если есть live → live; иначе предстоящие если есть; иначе finished
            const body = document.getElementById('leagueModal-body');
            body.innerHTML = `
                <button class="r-btn r-btn-ghost" id="backBtn" style="margin-bottom: 12px;">← Назад</button>
                <h4 style="margin: 0 0 12px;">${fmt.escapeHtml(league.name)} · сезон ${year}</h4>
                <div class="r-loading"><div class="r-spinner"></div> Загрузка…</div>
            `;
            document.getElementById('backBtn').addEventListener('click',
                () => openLeague(league.id, league.name));

            let summary;
            try {
                const r = await api.get('/api/db/games/season-summary',
                    { leagueId: league.id, season: year }, { ttl: 30000 });
                summary = (r && r.data) || {};
            } catch (e) {
                body.innerHTML += `<div class="league-empty">⚠ ${fmt.escapeHtml(e.message)}</div>`;
                return;
            }

            // Дефолтный фильтр
            let group;
            if ((summary.live || 0) > 0)               group = 'live';
            else if ((summary.scheduled || 0) > 0)     group = 'upcoming';
            else                                        group = 'finished';

            modalState = { league, year, summary, group, items: [], offset: 0, exhausted: false };
            renderSeasonShell();
            await loadMore(true);
        }

        function renderSeasonShell() {
            const { league, year, summary, group } = modalState;
            const body = document.getElementById('leagueModal-body');

            const pillCount = (n) => n > 0 ? `<span class="r-pill-count">${n}</span>` : '';
            const pills = [
                { id: 'upcoming', label: 'Предстоящие', cnt: (summary.scheduled||0) + (summary.postponed||0) },
                { id: 'live',     label: '🔴 Live',     cnt: summary.live || 0 },
                { id: 'finished', label: 'Завершённые', cnt: summary.finished || 0 },
                { id: 'all',      label: 'Все',         cnt: summary.total || 0 },
            ];

            body.innerHTML = `
                <button class="r-btn r-btn-ghost" id="backBtn" style="margin-bottom: 12px;">← Назад</button>
                <h4 style="margin: 0 0 6px;">${fmt.escapeHtml(league.name)} · сезон ${year}</h4>
                <div class="r-stat-grid">
                    ${C.statMiniSafe({ value: summary.total ?? 0,    label: 'Всего матчей' })}
                    ${C.statMiniSafe({ value: summary.finished ?? 0, label: 'Завершено'   })}
                    ${(summary.live ?? 0) > 0
                        ? C.statMiniSafe({ value: summary.live, label: 'Сейчас live', color: 'var(--live-color)' })
                        : C.statMiniSafe({ value: summary.scheduled ?? 0, label: 'Запланировано' })}
                </div>
                <div class="r-filter-pills" id="filterPills">
                    ${pills.map(p => `
                        <button class="r-pill ${p.id === group ? 'active' : ''}"
                                data-group="${p.id}"
                                ${p.cnt === 0 && p.id !== 'all' ? 'disabled style="opacity:.4;cursor:default;"' : ''}>
                            ${p.label}${pillCount(p.cnt)}
                        </button>`).join('')}
                </div>
                <div id="matchesList"></div>
                <div id="loadMoreWrap"></div>
            `;
            document.getElementById('backBtn').addEventListener('click',
                () => openLeague(league.id, league.name));
            document.getElementById('filterPills').addEventListener('click', e => {
                const p = e.target.closest('[data-group]');
                if (!p || p.disabled) return;
                if (p.dataset.group === modalState.group) return;
                modalState.group = p.dataset.group;
                modalState.items = [];
                modalState.offset = 0;
                modalState.exhausted = false;
                renderSeasonShell();
                loadMore(true);
            });
        }

        async function loadMore(initial = false) {
            const wrap = document.getElementById('loadMoreWrap');
            wrap.innerHTML = `<button class="r-load-more" disabled>Загрузка…</button>`;

            const { league, year, group, offset } = modalState;
            const params = {
                leagueId: league.id,
                season:   year,
                limit:    PAGE_SIZE,
                offset,
            };
            if (group !== 'all') params.statusGroup = group;

            try {
                const r = await api.get('/api/db/games/list', params, { ttl: 30000 });
                const got = (r && r.data) || [];
                modalState.items = modalState.items.concat(got);
                modalState.offset += got.length;
                if (got.length < PAGE_SIZE) modalState.exhausted = true;

                renderMatches();
            } catch (e) {
                wrap.innerHTML = `<div class="league-empty">⚠ ${fmt.escapeHtml(e.message)}</div>`;
            }
        }

        function renderMatches() {
            const { items, exhausted, summary, group } = modalState;
            const list = document.getElementById('matchesList');
            const wrap = document.getElementById('loadMoreWrap');

            if (!items.length) {
                list.innerHTML = `<div class="league-empty">Нет матчей в этой категории</div>`;
                wrap.innerHTML = '';
                return;
            }

            list.innerHTML =
                `<div class="r-text-muted r-text-sm" style="margin-bottom: 8px;">
                    Показано ${items.length} матчей
                 </div>` +
                items.map(C.matchRowDb).join('');

            if (exhausted) {
                wrap.innerHTML = `<div class="r-text-muted r-text-sm" style="text-align:center; padding: 12px;">
                    Это все матчи в этой категории
                </div>`;
            } else {
                wrap.innerHTML = `<button class="r-load-more" id="loadMoreBtn">Показать ещё 50 →</button>`;
                document.getElementById('loadMoreBtn').addEventListener('click', () => loadMore(false));
            }
        }

        document.body.addEventListener('click', e => {
            if (e.target.matches('[data-modal-close]') ||
                (e.target.classList.contains('r-modal-overlay') && e.target.id === 'leagueModal')) {
                document.getElementById('leagueModal').classList.remove('active');
                modalState = null;
            }
        });
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') {
                document.getElementById('leagueModal').classList.remove('active');
                modalState = null;
            }
        });

        init();
    })();
    </script>
</body>
</html>
